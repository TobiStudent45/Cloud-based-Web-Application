services:

  # Presentation Tier
  frontend:
    build: ./frontend
    ports:
      - "80:80"
    environment:
      GATEWAY_URL: http://backend:3000
    depends_on:
      - backend
    networks: [app-net]

  # API Gateway
  backend:
    build: ./backend
    depends_on:
      - configurator
      - product-info
      - merchandise
      - cart
      - orders
      - impressions
      - road2supercar
      - ai
    networks: [app-net]

  # Business Logic Tier
  configurator:
    build: ./services/configurator
    networks: [app-net]

  product-info:
    build: ./services/product-info
    networks: [app-net]

  merchandise:
    build: ./services/merchandise
    networks: [app-net]

  cart:
    build: ./services/cart
    networks: [app-net]

  orders:
    build: ./services/orders
    networks: [app-net]

  impressions:
    build: ./services/impressions
    networks: [app-net]

  road2supercar:
    build: ./services/road2supercar
    networks: [app-net]

  ai:
    build: ./services/ai
    networks: [app-net]

  # Data Tier
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      # TODO: Startskript einhängen, sobald db/mysql/init.sql existiert:
      # - ./db/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [app-net]

  mysql-admin:
    image: phpmyadmin:latest
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "8081:80"
    networks: [app-net]

  redis:
    image: redis:7-alpine
    volumes: [redis-data:/data]
    networks: [app-net]

  redis-admin:
    image: rediscommander/redis-commander:latest
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8082:8081"
    networks: [app-net]

  # MinIO (Object Storage, S3-API) – vorerst deaktiviert:
  # Image-Pull wird in dieser Umgebung vom Proxy blockiert.
  # Zum Reaktivieren Block einkommentieren + minio-data-Volume unten.
  # minio:
  #   image: minio/minio:RELEASE.2024-01-16T16-07-38Z
  #   command: server /data --console-address ":9001"
  #   environment:
  #     MINIO_ROOT_USER: ${MINIO_ROOT_USER}
  #     MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   volumes: [minio-data:/data]
  #   networks: [app-net]

volumes:
  mysql-data:
  redis-data:
  # minio-data:

networks:
  app-net:
    driver: bridge
