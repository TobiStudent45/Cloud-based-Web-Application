# Tiers: frontend (presentation), backend (API gateway), services (business logic), mysql/redis/minio (data).
# Only the frontend and the admin UIs publish ports; all other services are reachable inside app-net only.

services:

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    environment:
      GATEWAY_URL: http://backend:3000
    depends_on:
      backend:
        condition: service_started
    networks: [app-net]

  backend:
    build: ./backend
    depends_on:
      configurator:
        condition: service_healthy
      productinfo:
        condition: service_started
      merchandise:
        condition: service_started
      cart:
        condition: service_started
      orders:
        condition: service_started
      impressions:
        condition: service_started
      road2supercar:
        condition: service_started
      ai:
        condition: service_started
    networks: [app-net]

  configurator:
    build: ./services/configurator
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: carmanufacturer
      CATALOG_SCHEMA_PATH: /app/sql/configurator.sql
    volumes:
      - ./db/mysql/configurator.sql:/app/sql/configurator.sql:ro
      - ./db/mysql/configurator-options.sql:/app/sql/configurator-options.sql:ro
      - ./db/mysql/configurator-pricing.sql:/app/sql/configurator-pricing.sql:ro
      - ./db/mysql/configurator-configurations.sql:/app/sql/configurator-configurations.sql:ro
      - ./services/configurator/models:/app/models:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      mysql:
        condition: service_healthy
    networks: [app-net]

  productinfo:
    build: ./services/productinfo
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: carmanufacturer
    depends_on:
      mysql:
        condition: service_healthy
    networks: [app-net]

  merchandise:
    build: ./services/merchandise
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: merchandise
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: merchandise
    volumes:
      - ./db/minio/merchandise:/app/seed-images:ro
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started
    networks: [app-net]

  cart:
    build: ./services/cart
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    networks: [app-net]

  orders:
    build: ./services/orders
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: carmanufacturer
    depends_on:
      mysql:
        condition: service_healthy
    networks: [app-net]

  impressions:
    build: ./services/impressions
    environment:
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: impressions
    volumes:
      - ./db/minio/impressions:/app/seed-images:ro
    depends_on:
      minio:
        condition: service_started
    networks: [app-net]

  road2supercar:
    build: ./services/road2supercar
    networks: [app-net]

  ai:
    build: ./services/ai
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    networks: [app-net]

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./db/mysql/merchandise.sql:/docker-entrypoint-initdb.d/merchandise.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [app-net]

  mysql-admin:
    image: phpmyadmin:latest
    environment:
      PMA_HOST: mysql
    ports:
      - "8081:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks: [app-net]

  redis:
    image: redis:7-alpine
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [app-net]

  redis-admin:
    image: rediscommander/redis-commander:latest
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8082:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks: [app-net]

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes: [minio-data:/data]
    networks: [app-net]

volumes:
  mysql-data:
  redis-data:
  minio-data:

networks:
  app-net:
    driver: bridge
