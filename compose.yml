services:

  # Presentation Tier
  frontend:
    build: ./frontend
    ports:
      - "80:80"
    environment:
      GATEWAY_URL: http://backend:3000
    depends_on:
      backend:
        condition: service_started
    networks: [app-net]

  # API Gateway
  backend:
    build: ./backend
    depends_on:
      - configurator
      - productinfo
      - merchandise
      - cart
      - orders
      - impressions
      - road2supercar
      - ai
    networks: [app-net]

  # Business Logic Tier
  configurator:
    build: ./services/configurator
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: carmanufacturer
    depends_on:
      mysql:
        condition: service_healthy
    networks: [app-net]

  productinfo:
    build: ./services/productinfo
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: carmanufacturer
    depends_on:
      mysql:
        condition: service_healthy
    networks: [app-net]

  merchandise:
    build: ./services/merchandise
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: carmanufacturer
    depends_on:
      mysql:
        condition: service_healthy
    networks: [app-net]

  cart:
    build: ./services/cart
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    networks: [app-net]

  orders:
    build: ./services/orders
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: carmanufacturer
    depends_on:
      mysql:
        condition: service_healthy
    networks: [app-net]

  impressions:
    build: ./services/impressions
    networks: [app-net]

  road2supercar:
    build: ./services/road2supercar
    networks: [app-net]

  ai:
    build: ./services/ai
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    networks: [app-net]

  # Data Tier
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [app-net]

  mysql-admin:
    image: phpmyadmin:latest
    environment:
      PMA_HOST: mysql
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "8081:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks: [app-net]

  redis:
    image: redis:7-alpine
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [app-net]

  redis-admin:
    image: rediscommander/redis-commander:latest
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8082:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks: [app-net]

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes: [minio-data:/data]
    networks: [app-net]

volumes:
  mysql-data:
  redis-data:
  minio-data:

networks:
  app-net:
    driver: bridge
